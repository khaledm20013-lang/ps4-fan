name: Build PS4 Fan Control
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install OpenOrbis
        run: |
          wget https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/toolchain-linux.zip
          unzip toolchain-linux.zip
          echo "OO_PS4_TOOLCHAIN=$PWD/OpenOrbis" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p build
          $OO_PS4_TOOLCHAIN/bin/linux/ooc -o build/fan_control.elf src/main.c
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: fan_control
          path: build/fan_control.elf
